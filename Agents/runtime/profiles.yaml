# Which model each agent runs on.
# Ported to NVIDIA NIM / Build API (https://integrate.api.nvidia.com/v1).
# Choose a profile with `python -m Agents.runtime --profile <name>` or the
# SUPPLY_BRAIN_AGENT_PROFILE environment variable. `workers` applies to every agent
# except the orchestrator; an agent listed by name (e.g. validator_agent) overrides it.

default_profile: nvidia

profiles:
  # Primary NVIDIA Build profile using GLM 5.3 Flash. max_tokens raised from the
  # original 1024: GLM 5.3 appears to be a reasoning/thinking model, whose hidden
  # reasoning tokens count against max_tokens on this endpoint -- at 1024 the
  # orchestrator's first call came back with empty text AND no tool call (confirmed
  # in a real run's transcript), consistent with the whole budget being spent on
  # internal reasoning before any visible output or tool call could be emitted.
  nvidia:
    provider: nvidia
    orchestrator: {model: z-ai/glm-5.3-flash, max_tokens: 4096, temperature: 0.5}
    workers: {model: z-ai/glm-5.3-flash, max_tokens: 4096, temperature: 0.5}

  # Test profile pointing to NVIDIA build
  test:
    provider: nvidia
    orchestrator: {model: z-ai/glm-5.3-flash, max_tokens: 1024, temperature: 0.5}
    workers: {model: z-ai/glm-5.3-flash, max_tokens: 1024, temperature: 0.5}

  # Fast profile on NVIDIA build using Google Gemma 4
  nvidia-fast:
    provider: nvidia
    orchestrator: {model: google/gemma-4-31b-it, max_tokens: 1024, temperature: 0.5}
    workers: {model: google/gemma-4-31b-it, max_tokens: 1024, temperature: 0.5}

  # Production candidate on NVIDIA build
  production:
    provider: nvidia
    orchestrator: {model: z-ai/glm-5.3-flash, max_tokens: 2048, temperature: 0.3}
    validator_agent: {model: z-ai/glm-5.3-flash, max_tokens: 2048, temperature: 0.2}
    workers: {model: z-ai/glm-5.3-flash, max_tokens: 1024, temperature: 0.5}

  # Testing without an API key: a Claude/local Desktop session answers each model call
  # through the file bridge (runtime/bridge.py). Models are Desktop aliases.
  desktop:
    provider: desktop
    orchestrator: {model: sonnet}
    workers: {model: haiku}

  # Claude API profile, used by the app's "Claude" option. Needs ANTHROPIC_API_KEY.
  # Opus 5 thinks adaptively by default; effort is sent as output_config.effort. The
  # orchestrator opts into server-side refusal fallbacks. Haiku 4.5 takes neither effort
  # nor adaptive thinking, so the workers set neither.
  claude:
    provider: anthropic
    orchestrator: {model: claude-opus-5, effort: high, fallbacks: default}
    workers: {model: claude-haiku-4-5}

  # Legacy Anthropic profiles (retained for backwards compatibility if langchain-anthropic is installed)
  anthropic-test:
    provider: anthropic
    orchestrator: {model: claude-sonnet-4-6, effort: medium, thinking: adaptive}
    workers: {model: claude-haiku-4-5}

  anthropic-production:
    provider: anthropic
    orchestrator: {model: claude-opus-5-5, effort: high}
    validator_agent: {model: claude-opus-5-5, effort: high}
    workers: {model: claude-opus-5-5, effort: medium}
    fallbacks: default
