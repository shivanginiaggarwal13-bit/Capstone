# Which Claude model each agent runs on.
# Choose a profile with `python -m Agents.runtime --profile <name>` or the
# SUPPLY_BRAIN_AGENT_PROFILE environment variable. `workers` applies to every agent
# except the orchestrator; an agent listed by name (e.g. validator_agent) overrides it.

default_profile: test

profiles:
  # Testing: Sonnet 4.6 coordinates, Haiku 4.5 does the specialist work.
  # Needs Anthropic credentials (ANTHROPIC_API_KEY, or the gateway in ANTHROPIC_BASE_URL).
  test:
    provider: anthropic
    orchestrator: {model: claude-sonnet-4-6, effort: medium, thinking: adaptive}
    workers: {model: claude-haiku-4-5}

  # Testing without an API key: a Claude Desktop session answers each model call
  # through the file bridge (runtime/bridge.py). Models are Claude Desktop aliases.
  desktop:
    provider: desktop
    orchestrator: {model: sonnet}
    workers: {model: haiku}

  # Production candidate -- confirm on the eval set (IMPLEMENTATION_PLAN.md 5.4) before adopting.
  production:
    provider: anthropic
    orchestrator: {model: claude-opus-5-5, effort: high}
    validator_agent: {model: claude-opus-5-5, effort: high}
    workers: {model: claude-opus-5-5, effort: medium}
    fallbacks: default        # server-side refusal fallback for the Opus 5.5 family
